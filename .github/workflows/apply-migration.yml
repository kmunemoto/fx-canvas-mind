# Applying one migration file from the repository, instead of from a chat turn.
#
# Migrations of this project are applied by hand, one at a time, in the order
# docs/OPERATIONS.md section 10 gives (migration -> functions -> screen). Until
# now the SQL went out as an inline tool call: the whole file retyped into one
# message. That is the path deploy-functions.yml was written to get away from
# (one character of a 97 KB bundle came back different; 116 KB did not go
# through at all), and #397's morning check (scripts/morning-check v9) made a
# migration of 85 KB: two functions whose source must be the repository's byte
# for byte (their RUN row says md5(prosrc), compared with the file's md5).
#
# So the bytes no longer travel through anybody's message here either. GitHub
# checks out main and sends the file as it is to the project's database
# through the Management API (the same door the inline tool call uses), with
# the token deploy-functions.yml already holds.
#
# Guards:
#   - by hand only (workflow_dispatch), and only from main;
#   - one file, named, under supabase/migrations/ (the name's shape is checked:
#     14 digits, an underscore, lower-case letters, digits and underscores,
#     .sql), never a path;
#   - the caller gives the file's sha256 and the run stops when the checked-out
#     file differs: what is applied is what was read;
#   - the file is sent whole, as one query (whether a file of several
#     statements is undone as a whole when one fails was not tested: write
#     migrations that can be run again);
#   - the token is never printed; of the answer only the HTTP status and the
#     first bytes are (a migration returns no rows).
# Not done: nothing is written to supabase_migrations.schema_migrations (the
# inline tool recorded its own version there, which never matched the file
# names anyway; the files and docs/OPERATIONS.md are the record). Running a
# file twice is safe only when the file is (create ... if not exists, create or
# replace): read it first.
name: Apply a migration

on:
  workflow_dispatch:
    inputs:
      file:
        description: "The file's name under supabase/migrations/, e.g. 20261112130000_morning_check_v9.sql"
        required: true
      sha256:
        description: "sha256 of that file as it is on main (sha256sum); the run stops when it differs"
        required: true

concurrency:
  group: apply-migration
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: endcqzewujdvimdlazhj
      FILE: ${{ github.event.inputs.file }}
      SHA256: ${{ github.event.inputs.sha256 }}
    steps:
      - name: Only from main, and only with a token
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::Run this from main (got ${GITHUB_REF}): a migration is applied as it is on main."
            exit 1
          fi
          if [ -z "${SUPABASE_ACCESS_TOKEN}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is not set for this repository."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: The file, and that it is the one meant
        run: |
          set -euo pipefail
          if ! printf '%s' "${FILE}" | grep -Eq '^[0-9]{14}_[a-z0-9_]+\.sql$'; then
            echo "::error::Not a migration file's name: ${FILE}"
            exit 1
          fi
          f="supabase/migrations/${FILE}"
          test -f "${f}" || { echo "::error::No such file on main: ${f}"; exit 1; }
          if ! printf '%s' "${SHA256}" | grep -Eq '^[0-9a-f]{64}$'; then
            echo "::error::sha256 must be 64 lower-case hex digits"
            exit 1
          fi
          got=$(sha256sum "${f}" | cut -d' ' -f1)
          echo "file ${f}: $(wc -c < "${f}") bytes, sha256 ${got}"
          if [ "${got}" != "${SHA256}" ]; then
            echo "::error::The file on main is not the one meant (sha256 differs). Nothing was applied."
            exit 1
          fi

      - name: Apply
        run: |
          set -euo pipefail
          f="supabase/migrations/${FILE}"
          jq -Rs '{query: .}' "${f}" > "${RUNNER_TEMP}/body.json"
          code=$(curl -sS -o "${RUNNER_TEMP}/answer.json" -w '%{http_code}' \
            -X POST "https://api.supabase.com/v1/projects/${PROJECT_REF}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary "@${RUNNER_TEMP}/body.json")
          echo "http ${code}"
          echo "answer (first 600 bytes):"
          head -c 600 "${RUNNER_TEMP}/answer.json" || true
          echo
          case "${code}" in
            200|201) echo "applied: ${FILE}" ;;
            *) echo "::error::The database did not take the migration (http ${code}). Nothing is assumed applied."; exit 1 ;;
          esac
