# #142: which indicator reads the big flow of a chart best
# (research/bigflow.ts, research/bigflow-lib.ts).
#
# Runs on GitHub's runners because they can reach GMO's public price API and
# the development container cannot. Read-only: it fetches public prices,
# prints a report to the job log and uploads the same numbers as an
# artifact. It writes nothing to the repository and holds no secret.
name: Research big flow

on:
  push:
    branches:
      - claude/app-confirmation-jvmk03
    paths:
      - research/bigflow.ts
      - research/bigflow-lib.ts
      - .github/workflows/bigflow.yml
  workflow_dispatch:
    inputs:
      pairs:
        description: "Comma-separated pairs (empty: all eleven GMO pairs)"
        default: ""
      split:
        description: "First day of the second (checking) period"
        default: "2025-07-01"
      synthetic:
        description: "Run on a random walk instead (any text: yes)"
        default: ""

permissions:
  contents: read

jobs:
  bigflow:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # the same day files research/gainz.ts caches
      - uses: actions/cache@v4
        with:
          path: research/.cache
          key: gmo-15min-${{ github.run_id }}
          restore-keys: gmo-15min-
      # src/lib's modules import one another without the extension (Vite's
      # way), hence --sloppy-imports
      - name: Run the study
        env:
          PAIRS: ${{ inputs.pairs || '' }}
          SPLIT: ${{ inputs.split || '2025-07-01' }}
          SYNTHETIC: ${{ inputs.synthetic || '' }}
        run: >
          deno run
          --sloppy-imports
          --v8-flags=--max-old-space-size=6144
          --allow-net=forex-api.coin.z.com
          --allow-read=.
          --allow-write=research/.cache,research/out
          --allow-env=PAIRS,START,SPLIT,SYNTHETIC
          research/bigflow.ts
      - uses: actions/upload-artifact@v4
        with:
          name: bigflow-out
          path: research/out/
          retention-days: 30
