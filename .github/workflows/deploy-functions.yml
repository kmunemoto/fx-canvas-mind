# Deploying the edge functions from the repository, instead of from a chat turn.
#
# Every deploy until now went out as an inline tool call carrying the whole
# minified bundle: ~100 KB of text retyped into a single message. That path has
# a ceiling — 106,525 bytes went through on 2026-09-19, 116,242 bytes did not
# (the body was silently dropped and only deno.json arrived) — and #96 pushed
# analyze to 115,580 bytes, past it. It also put a transcription step in front
# of production twice (#48, #51) and again on 2026-09-19, when one character of
# a 97 KB bundle came back different.
#
# So the bytes no longer travel through anybody's message. GitHub checks out the
# repository and the Supabase CLI deploys the TypeScript sources directly, which
# also makes supabase/functions/**/index.ts the single source of truth: the
# esbuild bundles under supabase/functions/*/bundle.js stay in the toolbox for
# local size checks and for the inline fallback, and are no longer what runs.
#
# verify_jwt for each function comes from supabase/config.toml, not from a flag
# here, so the setting lives beside the function it belongs to.
name: Deploy edge functions

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-functions.yml"
  workflow_dispatch:
    inputs:
      functions:
        description: "Space-separated slugs to deploy. Empty deploys the analyzer set below."
        required: false
        default: ""

concurrency:
  # Two deploys of the same function racing would leave nobody able to say which
  # build is live.
  group: deploy-edge-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: endcqzewujdvimdlazhj
    steps:
      - uses: actions/checkout@v4

      - name: Refuse to run without a token, and say so
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is not set for this repository." \
                 "Create one at https://supabase.com/dashboard/account/tokens and add it under" \
                 "Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy
        run: |
          set -euo pipefail
          # The analyzer set. The payment functions (create-checkout,
          # stripe-webhook, cancel-subscription) and econ-calendar are
          # deliberately NOT in the default list: they are not part of this
          # pipeline and a push that does not touch them should not redeploy
          # them. Name them explicitly in workflow_dispatch to deploy one.
          # signal-alerts (#105) IS in it: it imports analyze's rule
          # (rsisar.ts), and a change to the rule must reach the emails too.
          # live-chart (#113) likewise reads both rules.
          FUNCTIONS="${{ github.event.inputs.functions }}"
          if [ -z "${FUNCTIONS}" ]; then
            FUNCTIONS="analyze position-review postmortem track-outcomes noise-floor version-compare signal-alerts live-chart"
          fi
          for slug in ${FUNCTIONS}; do
            echo "::group::deploy ${slug}"
            supabase functions deploy "${slug}" --project-ref "${PROJECT_REF}"
            echo "::endgroup::"
          done

      - name: Report what is live
        run: supabase functions list --project-ref "${PROJECT_REF}"
