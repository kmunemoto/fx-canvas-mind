# The study behind #110: does letting winners run (the SAR as a trailing
# stop, or a 3-ATR chandelier stop) pay where the fixed 1.5x target did not?
#
# Runs research/exits.ts on GitHub's runners because they can reach GMO's
# public price API and the development container cannot. Read-only: public
# prices in, a report out; it writes nothing to the repository and holds no
# secret.
name: Research exits

on:
  push:
    branches:
      - claude/app-confirmation-jvmk03
    paths:
      - research/exits.ts
      - .github/workflows/exits.yml
  workflow_dispatch:
    inputs:
      split:
        description: "First day of the second (checking) period"
        default: "2025-07-01"

permissions:
  contents: read

jobs:
  exits:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/cache@v4
        with:
          path: research/.cache
          key: gmo-15min-${{ github.run_id }}
          restore-keys: gmo-15min-
      - name: Run the study
        env:
          SPLIT: ${{ inputs.split || '2025-07-01' }}
        run: >
          deno run
          --v8-flags=--max-old-space-size=6144
          --allow-net=forex-api.coin.z.com
          --allow-read=.
          --allow-write=research/.cache,research/out
          --allow-env=PAIRS,START,SPLIT,SYNTHETIC
          research/exits.ts
