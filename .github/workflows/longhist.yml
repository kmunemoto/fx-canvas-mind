# The study behind #109: does daily trend following, or collecting the
# interest-rate differential (swap), pay over 25 years of currencies?
#
# Downloads the ECB's public daily reference rates (1999 on) and FRED's
# public OECD 3-month interbank rates (or, when FRED does not answer, the
# BIS's public policy rates), runs research/longhist.ts and prints
# the report to the job log. Read-only: public data in, a report out; it
# writes nothing to the repository and holds no secret.
name: Research long history

on:
  push:
    branches:
      - claude/app-confirmation-jvmk03
    paths:
      - research/longhist.ts
      - research/longhist-lib.ts
      - .github/workflows/longhist.yml
  workflow_dispatch:
    inputs:
      split:
        description: "First day of the second (checking) period"
        default: "2013-01-01"

permissions:
  contents: read

jobs:
  longhist:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Download the ECB reference rates and the FRED interest rates
        run: |
          set -euo pipefail
          mkdir -p research/.cache/ecb research/.cache/fred
          curl -sSfL --retry 4 -A "fx-canvas-mind-research/1.0" -o /tmp/ecb.zip https://www.ecb.europa.eu/stats/eurofxref/eurofxref-hist.zip
          unzip -o -q /tmp/ecb.zip -d research/.cache/ecb
          head -c 300 research/.cache/ecb/eurofxref-hist.csv; echo
          # FRED answered every HTTP/2 request from the runner with a stream
          # error (first run, 2026-09-25) and left HTTP/1.1 ones hanging
          # (second run), so each try is time-limited, and after the first
          # series that cannot be had the rest are not tried: the study then
          # uses the BIS's policy rates for every currency (never a mix)
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"
          for id in IR3TIB01USM156N IR3TIB01JPM156N IR3TIB01EZM156N IR3TIB01GBM156N IR3TIB01AUM156N IR3TIB01NZM156N IR3TIB01CAM156N IR3TIB01CHM156N; do
            out="research/.cache/fred/${id}.csv"
            if ! curl -sSfL --http1.1 --connect-timeout 15 --max-time 60 -A "$UA" -o "$out" "https://fred.stlouisfed.org/graph/fredgraph.csv?id=${id}"; then
              rm -f "$out"
              echo "FRED ${id} failed; not trying the rest"
              break
            fi
            echo "${id}: $(wc -l < "$out") lines, first: $(sed -n 2p "$out"), last: $(tail -n 1 "$out")"
            sleep 1
          done
          mkdir -p research/.cache/bis
          if curl -sSfL --connect-timeout 15 --max-time 300 -A "$UA" -o /tmp/bis.zip https://data.bis.org/static/bulk/WS_CBPOL_csv_flat.zip; then
            unzip -o -q /tmp/bis.zip -d research/.cache/bis
            for f in research/.cache/bis/*.csv; do echo "BIS $f: $(wc -l < "$f") lines"; head -n 1 "$f" | cut -c1-400; done
          else
            echo "BIS download failed"
          fi
      - name: Run the study
        env:
          SPLIT: ${{ inputs.split || '2013-01-01' }}
        run: >
          deno run
          --allow-read=.
          --allow-write=research/out
          --allow-env=SPLIT,SYNTHETIC
          research/longhist.ts
      - uses: actions/upload-artifact@v4
        with:
          name: longhist-out
          path: research/out/
          retention-days: 30
