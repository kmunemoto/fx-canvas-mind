# #272 (docs §8.109): the MACD extreme-cross rule against the ULTRA 5-minute
# emails (research/macdx.ts; the rule in research/macdx-lib.ts, frozen in PR #197).
#
#   push      the hand examples (確かめ 4) and three random walks (確かめ 2), each
#             with the Python re-computation (確かめ 3) when it is in the repository
#   dispatch  mode=walk (seeds), mode=repro (確かめ 5: ULTRA alone on the 21 pairs,
#             against run 37191488441; no MACD number is computed), mode=real
#             (the 5 pairs, 2024-01-01 .. 2026-10-09 00:00 UTC, once) or
#             mode=real21 (the same on the 21 pairs of the 71.9%: a reference
#             only, (a)(b)(c) not judged)
#
# On real data the study's report goes to a file first; it is printed only after
# the look-ahead check (inside the TS) and the Python re-computation have both
# passed, so no result is read before the checks (§8.109 確かめ). The outputs are
# uploaded whole only when every step passed; when a step failed, only
# bars.csv and decisions.csv go up (to find the mismatch), never trades.csv,
# report.json or the report, which hold the results.
#
# Runs on GitHub's runners because they can reach GMO's public price API and the
# development container cannot. Read-only: it fetches public prices, prints to
# the job log and uploads research/out/macdx. It writes nothing to the
# repository and holds no secret.
name: Research MACD extreme crosses
on:
  push:
    branches:
      - claude/app-confirmation-jvmk03
    paths:
      - research/macdx.ts
      - research/macdx-lib.ts
      - research/macdx-hand.ts
      - research/macdx-check.py
      - .github/workflows/macdx.yml
  workflow_dispatch:
    inputs:
      mode:
        description: "walk / repro / real / real21"
        default: "walk"
      seeds:
        description: "walk seeds (JSON list)"
        default: "[1, 2, 3]"
permissions:
  contents: read

jobs:
  hand:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Hand examples (確かめ 4)
        run: deno run --allow-read=. research/macdx-hand.ts

  walk:
    needs: hand
    if: ${{ github.event_name == 'push' || inputs.mode == 'walk' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        seed: ${{ fromJSON(github.event_name == 'push' && '[1, 2, 3]' || inputs.seeds) }}
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: The study on a random walk (確かめ 1 and 2)
        env:
          MODE: walk
          SEED: ${{ matrix.seed }}
        run: >
          deno run
          --v8-flags=--max-old-space-size=6144
          --allow-read=.
          --allow-write=research/out,research/.cache-walk
          --allow-env=MODE,PAIRS,START,SPLIT,END,SEED
          research/macdx.ts
      - name: The Python re-computation on the same walk (確かめ 3)
        run: |
          if [ ! -f research/macdx-check.py ]; then echo "research/macdx-check.py is not written yet"; exit 0; fi
          python3 -I research/macdx-check.py --bars research/.cache-walk/seed${{ matrix.seed }} --walk --ts research/out/macdx
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macdx-walk-seed${{ matrix.seed }}
          path: research/out/macdx
          if-no-files-found: ignore
          retention-days: 30

  repro:
    needs: hand
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'repro' }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - id: own
        uses: actions/cache/restore@v4
        with:
          path: research/.cache
          key: gmo-tf-none
          restore-keys: gmo-tf-
      - if: steps.own.outputs.cache-matched-key == ''
        uses: actions/cache/restore@v4
        with:
          path: research/.cache
          key: gmo-5min-none
          restore-keys: gmo-5min-
      - name: ULTRA alone on the 21 pairs against run 37191488441 (確かめ 5)
        env:
          MODE: repro
        run: >
          deno run
          --v8-flags=--max-old-space-size=6144
          --allow-net=forex-api.coin.z.com
          --allow-read=.
          --allow-write=research/.cache,research/out
          --allow-env=MODE,PAIRS,START,SPLIT,END,SEED
          research/macdx.ts
      - if: always()
        uses: actions/cache/save@v4
        with:
          path: research/.cache
          key: gmo-tf-${{ github.run_id }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macdx-repro
          path: research/out/macdx
          if-no-files-found: ignore
          retention-days: 30

  real:
    needs: hand
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.mode == 'real' || inputs.mode == 'real21') }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - id: own
        uses: actions/cache/restore@v4
        with:
          path: research/.cache
          key: gmo-tf-none
          restore-keys: gmo-tf-
      - if: steps.own.outputs.cache-matched-key == ''
        uses: actions/cache/restore@v4
        with:
          path: research/.cache
          key: gmo-5min-none
          restore-keys: gmo-5min-
      - name: The study on GMO's bars (the report to a file only)
        env:
          MODE: ${{ inputs.mode }}
        run: |
          mkdir -p research/out/macdx
          deno run \
            --v8-flags=--max-old-space-size=6144 \
            --allow-net=forex-api.coin.z.com \
            --allow-read=. \
            --allow-write=research/.cache,research/out \
            --allow-env=MODE,PAIRS,START,SPLIT,END,SEED \
            research/macdx.ts > research/out/macdx/print.txt 2>&1 || { echo "the study stopped (its checks failed or it crashed); the lines that name a check:"; grep -E "^(確かめ|ULTRA against|GMO reads|error|Error)" research/out/macdx/print.txt; exit 1; }
          echo "the study finished; its report is held back until the Python re-computation has passed"
      - if: always()
        uses: actions/cache/save@v4
        with:
          path: research/.cache
          key: gmo-tf-${{ github.run_id }}
      - name: The Python re-computation (確かめ 3)
        env:
          MODE: ${{ inputs.mode }}
        run: |
          # real: the 5 pairs (the Python's default); real21: the 21 pairs of research/lib.ts GMO_STUDY_PAIRS
          PAIRS="USD/JPY,EUR/JPY,AUD/JPY,EUR/USD,AUD/USD"
          if [ "$MODE" = "real21" ]; then
            PAIRS="USD/JPY,EUR/JPY,GBP/JPY,AUD/JPY,EUR/USD,GBP/USD,AUD/USD,MXN/JPY,NZD/JPY,ZAR/JPY,CAD/JPY,CHF/JPY,TRY/JPY,NZD/USD,EUR/GBP,AUD/NZD,HUF/JPY,SEK/JPY,NOK/SEK,AUD/CAD,NZD/CAD"
          fi
          python3 -I research/macdx-check.py --bars research/.cache --ts research/out/macdx --start 2024-01-01 --split 2025-05-19 --end 2026-10-09T00:00:00Z --pairs "$PAIRS"
      - name: The report (printed only after the checks)
        run: cat research/out/macdx/print.txt
      - if: success()
        uses: actions/upload-artifact@v4
        with:
          name: macdx-${{ inputs.mode }}
          path: research/out/macdx
          if-no-files-found: ignore
          retention-days: 30
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macdx-${{ inputs.mode }}-failed-checks-only
          path: |
            research/out/macdx/bars.csv
            research/out/macdx/decisions.csv
          if-no-files-found: ignore
          retention-days: 30
