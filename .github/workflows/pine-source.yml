# Reads the published source of an open-source TradingView script, so an
# indicator the owner asks for can be rebuilt from its actual code rather
# than from its description. The development container cannot reach
# TradingView; GitHub's runners can.
#
# Read-only: fetches one public script page and its published source, prints
# them to the job log. Writes nothing to the repository and holds no secret.
name: Read a TradingView open-source script

on:
  push:
    branches:
      - claude/app-confirmation-jvmk03
    paths:
      - .github/workflows/pine-source.yml
  workflow_dispatch:
    inputs:
      url:
        description: "The script's page on TradingView"
        default: "https://www.tradingview.com/script/uTeXKnH4-FVG-Crossfire/"

permissions:
  contents: read

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch the page and the published source
        env:
          URL: ${{ inputs.url || 'https://www.tradingview.com/script/uTeXKnH4-FVG-Crossfire/' }}
        run: |
          set -euo pipefail
          curl -sSL --max-time 30 -A "Mozilla/5.0 (X11; Linux x86_64)" "$URL" -o page.html
          python3 - <<'PY'
          import html, json, re, urllib.parse, urllib.request

          s = open("page.html", encoding="utf-8", errors="replace").read()
          print(f"page: {len(s)} chars")
          meta = re.search(r'<meta[^>]+(?:name|property)="(?:og:)?description"[^>]+content="([^"]*)"', s)
          if meta:
              print("=== DESCRIPTION (meta) ===")
              print(html.unescape(meta.group(1)))
          ids = list(dict.fromkeys(re.findall(r'PUB;[0-9a-f]{20,}', s)))
          print("script ids:", ids[:5])
          # the page's own long description, when it is embedded
          for m in re.finditer(r'"description"\s*:\s*"((?:[^"\\]|\\.){400,})"', s):
              print("=== DESCRIPTION (page) ===")
              print(json.loads('"' + m.group(1) + '"'))
              break
          done = False
          for sid in ids:
              for ver in ("last", "1"):
                  url = f"https://pine-facade.tradingview.com/pine-facade/get/{urllib.parse.quote(sid, safe='')}/{ver}?no_4xx=true"
                  try:
                      req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0", "Referer": "https://www.tradingview.com/"})
                      body = json.load(urllib.request.urlopen(req, timeout=30))
                  except Exception as e:
                      print(f"{sid}/{ver}: {e}")
                      continue
                  src = body.get("source") if isinstance(body, dict) else None
                  if not src:
                      print(f"{sid}/{ver}: no source ({str(body)[:200]})")
                      continue
                  print(f"=== SOURCE {sid} v{body.get('version', ver)} ({len(src.splitlines())} lines) ===")
                  print(src)
                  print("=== END SOURCE ===")
                  done = True
                  break
              if done:
                  break
          if not done:
              i = s.find("PUB;")
              print("no source found; around the first id:", s[max(0, i - 300):i + 300] if i >= 0 else "(no id on the page)")
          PY
