# #134: can a stochastic signal be told from a false one when it fires
# (research/stochfake.ts).
#
# Runs on GitHub's runners because they can reach GMO's public price API and
# the development container cannot. Read-only: it fetches public prices,
# prints a report to the job log and uploads the same numbers as an
# artifact. It writes nothing to the repository and holds no secret.
name: Research stochastic false signals

on:
  push:
    branches:
      - claude/app-confirmation-jvmk03
    paths:
      - research/stochfake.ts
      - .github/workflows/stochfake.yml
  workflow_dispatch:
    inputs:
      pairs:
        description: "Comma-separated pairs (empty: all eleven GMO pairs)"
        default: ""
      split:
        description: "First day of the second (checking) period"
        default: "2025-07-01"

permissions:
  contents: read

jobs:
  stochfake:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # the same day files research/gainz.ts caches
      - uses: actions/cache@v4
        with:
          path: research/.cache
          key: gmo-15min-${{ github.run_id }}
          restore-keys: gmo-15min-
      - name: Run the study
        env:
          PAIRS: ${{ inputs.pairs || '' }}
          SPLIT: ${{ inputs.split || '2025-07-01' }}
        run: >
          deno run
          --v8-flags=--max-old-space-size=6144
          --allow-net=forex-api.coin.z.com
          --allow-read=.
          --allow-write=research/.cache,research/out
          --allow-env=PAIRS,START,SPLIT,SYNTHETIC
          research/stochfake.ts
      - uses: actions/upload-artifact@v4
        with:
          name: stochfake-out
          path: research/out/
          retention-days: 30
