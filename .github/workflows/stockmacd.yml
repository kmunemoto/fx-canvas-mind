# #390 (docs §8.133): the 1-hour MACD email's rule (v8) on 22 US and Japanese shares' hourly bars from Yahoo,
# followed the owner's way (a limit at E, a take-profit of 0.1 / 0.25 / 0.5 / 1 percent, no stop).
# research/stockmacd.ts (the rule and output: research/stockmacd-spec.md), and the Python written apart from it
# (research/stockmacd-check.py): the numbers are printed only when every row and number agree.
#
#   syn   seeded walks written as Yahoo's files, the study on them, the look-ahead check, the Python on the same files
#   real  Yahoo's files (fetched here: GitHub's runners reach Yahoo, the development container cannot), after syn
#
# Read-only: public files fetched, a report printed; it writes nothing to the repository and holds no secret.
name: Research stockmacd (#390)

on:
  push:
    branches:
      - claude/app-confirmation-jvmk03
    paths:
      - research/stockmacd*.ts
      - research/stockmacd-check.py
      - .github/workflows/stockmacd.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  END: "2026-10-31T00:00:00Z"

jobs:
  syn:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OUT: research/out/stockmacd-syn
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      - name: Seeded walks as Yahoo's files, the study, the look-ahead check
        env:
          MODE: synthetic
        run: deno run --allow-read=. --allow-write=research/out --allow-env research/stockmacd.ts
      - name: The Python on the same files
        run: python3 -I research/stockmacd-check.py --files $OUT/yahoo --out $OUT --symbols AAPL,INTC,7203.T

  real:
    needs: [syn]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OUT: research/out/stockmacd
      DIR: research/.cache/yahoo
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      - name: Yahoo's hourly bars, 730 days, one file a share
        run: |
          set -euo pipefail
          mkdir -p "$DIR"
          for s in NVDA INTC AAPL MSFT GOOGL AMZN META TSLA 7203.T 6758.T 9984.T 8306.T 6861.T 9983.T 8035.T 7974.T 9432.T 6501.T 7267.T 6920.T 4063.T 8058.T; do
            ok=""
            for try in 1 2 3 4; do
              if curl -sS --max-time 30 -A "Mozilla/5.0" -o "$DIR/$s.json" \
                "https://query1.finance.yahoo.com/v8/finance/chart/$s?interval=60m&range=730d&includePrePost=false" &&
                jq -e '.chart.result[0].timestamp | length > 1000' "$DIR/$s.json" >/dev/null; then
                ok=1
                break
              fi
              sleep $((try * 3))
            done
            [ -n "$ok" ] || { echo "::error::$s: no hourly bars from Yahoo"; head -c 300 "$DIR/$s.json" || true; exit 1; }
            echo "$s $(jq -c '[(.chart.result[0].timestamp | length), (.chart.result[0].timestamp[0] | todate), (.chart.result[0].timestamp[-1] | todate)]' "$DIR/$s.json")"
            sleep 1
          done
          sha256sum "$DIR"/*.json
      - name: The study (its numbers go to files; none printed here)
        env:
          MODE: real
        run: |
          deno run --allow-read=. --allow-write=research/out --allow-env research/stockmacd.ts
          sha256sum $OUT/rows.csv $OUT/summary.json
      - name: The Python on the same files and rows
        run: python3 -I research/stockmacd-check.py --files $DIR --out $OUT
      - uses: actions/upload-artifact@v4
        with:
          name: stockmacd-${{ github.run_id }}
          path: |
            research/out/stockmacd
            research/.cache/yahoo
      - name: The numbers (the Python agreed)
        env:
          MODE: print
        run: deno run --allow-read=. --allow-env research/stockmacd.ts
