# #157: which timeframe's email signals (Q-Trend and ULTRA) win most often
# (research/tf-winrate.ts). #166: the stop is an input, 30 unless given (the
# emails' on the currency pairs since #166); #157's own figures are SL 10.
# #173: TP1 is an input too, 20 unless given (TP2 and TP3 twice and three
# times it: the emails' on the currency pairs since #173); #166's are TP1 5.
# #192: TP2 and TP3 are inputs of their own (twice and three times TP1 unless
# given); the emails' since #192 are the stop 13 and TP 4, 10 and 16, the
# defaults now.
#
# Runs on GitHub's runners because they can reach GMO's public price API and
# the development container cannot. Read-only: it fetches public prices,
# prints a report to the job log and uploads the same numbers as an
# artifact. It writes nothing to the repository and holds no secret.
name: Research timeframe win rates
on:
  push:
    branches:
      - claude/app-confirmation-jvmk03
    paths:
      - research/tf-winrate.ts
      - .github/workflows/tf-winrate.yml
  workflow_dispatch:
    inputs:
      pairs:
        description: "Comma-separated pairs (empty: the 21 GMO serves)"
        default: ""
      start:
        description: "First day judged"
        default: "2024-01-01"
      split:
        description: "First day of the second half"
        default: "2025-05-19"
      sl:
        description: "The stop, pips (#157: 10; #166: 30; the emails' since #192: 13)"
        default: "13"
      tp1:
        description: "TP1, pips (#166: 5; #173: 20; the emails' since #192: 4)"
        default: "4"
      tp2:
        description: "TP2, pips (empty: twice TP1; the emails' since #192: 10)"
        default: "10"
      tp3:
        description: "TP3, pips (empty: three times TP1; the emails' since #192: 16)"
        default: "16"
      end:
        description: "#182: when the study ends, ISO (empty: now; run 36730814776's: 2026-09-30T14:40:11Z)"
        default: ""
      weekend:
        description: "#182: weekend bars out by inside (barInsideClosure, the sweep's since #182) or stamp (before #182)"
        default: "inside"
permissions:
  contents: read

jobs:
  tf-winrate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # GMO's day files never change once the day has rolled: this study's
      # own kept files, or else those the 5-minute (#156) and 15-minute
      # studies kept, so only the rest is fetched
      - id: own
        uses: actions/cache/restore@v4
        with:
          path: research/.cache
          key: gmo-tf-none
          restore-keys: gmo-tf-
      - if: steps.own.outputs.cache-matched-key == ''
        uses: actions/cache/restore@v4
        with:
          path: research/.cache
          key: gmo-5min-none
          restore-keys: gmo-5min-
      - if: steps.own.outputs.cache-matched-key == ''
        uses: actions/cache/restore@v4
        with:
          path: research/.cache
          key: gmo-15min-none
          restore-keys: gmo-15min-
      - name: Run the study
        env:
          PAIRS: ${{ inputs.pairs || '' }}
          START: ${{ inputs.start || '2024-01-01' }}
          SPLIT: ${{ inputs.split || '2025-05-19' }}
          SL: ${{ inputs.sl || '13' }}
          TP1: ${{ inputs.tp1 || '4' }}
          TP2: ${{ github.event_name == 'push' && '10' || inputs.tp2 }}
          TP3: ${{ github.event_name == 'push' && '16' || inputs.tp3 }}
          END: ${{ inputs.end || '' }}
          WEEKEND: ${{ inputs.weekend || 'inside' }}
        run: >
          deno run
          --v8-flags=--max-old-space-size=6144
          --allow-net=forex-api.coin.z.com
          --allow-read=.
          --allow-write=research/.cache,research/out
          --allow-env=PAIRS,START,SPLIT,SYNTHETIC,SL,TP1,TP2,TP3,END,WEEKEND
          research/tf-winrate.ts
      # kept even when the run fails, so the files fetched are not fetched again
      - if: always()
        uses: actions/cache/save@v4
        with:
          path: research/.cache
          key: gmo-tf-${{ github.run_id }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tf-winrate-out
          path: research/out/
          retention-days: 30
