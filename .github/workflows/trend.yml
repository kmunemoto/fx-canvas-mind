# #250 (docs §8.106): would a condition on the chart's Dow line raise the win rate of the 15-minute
# ULTRA emails? Stage 0 (§8.106 6): each email's Dow labels and the four candidates' counts only — no
# outcome is read (research/trend.ts imports no outcome code).
#
#   push (every run): the walks only, before any real data is read
#     syn      research/trend.ts on two walks written as GMO's files (seeds 1, 2): every check of
#              §8.106 11 that touches the labels; the Python (research/trend-check.py) on the same files,
#              every label, half and count the same; the planted errors, each caught by a check of the TS
#   dispatch stage0 = yes (and only then; after syn passed in the same run):
#     stage0   GMO's real bars: (a)'s emails labelled; the checks; the Python on the same files; the
#              counts (print.txt) printed only once every check and the Python passed
#
# GitHub's runners reach GMO's public price API, which the development container cannot. Read-only:
# public files fetched, a report printed; it writes nothing to the repository and holds no secret.
name: Research trend (stage 0)

on:
  push:
    branches:
      - claude/app-confirmation-jvmk03
    paths:
      - research/trend*.ts
      - research/trend-check.py
      - research/ledger/trend-examples.csv
      - .github/workflows/trend.yml
  workflow_dispatch:
    inputs:
      stage0:
        description: "Stage 0 on GMO's real bars, after the walks pass (yes/no)"
        default: "no"
      label_end:
        description: "The bars are read to this UTC time (the run starts an hour after it at least)"
        default: "2026-10-09T12:00:00Z"

permissions:
  contents: read

jobs:
  syn:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      - name: The walks (seeds 1 and 2) — every check, then the Python on the same files
        run: |
          mkdir -p research/out/trend
          for seed in 1 2; do
            d=research/out/trend/syn$seed
            s=0
            MODE=syn SEED=$seed OUT=$d deno run --v8-flags=--max-old-space-size=8192 \
              --allow-read=. --allow-write=research/out --allow-env research/trend.ts > $d.log 2>&1 || s=$?
            grep -E "^(ok  |FAIL)|sha256|^signals|^read " $d.log
            if [ "$s" != "0" ]; then tail -n 60 $d.log; echo "::error::walk $seed: exit $s"; exit 1; fi
            python3 -I research/trend-check.py --gmo $d/gmo --labels $d/trend-labels.csv --counts $d/counts.json --mode syn
          done
      - name: The planted errors (each caught by a check of the TS; the Python's verdict shown)
        run: |
          for p in formingInWindow hourMidPrice oneBarAhead readAtTminus15 lateFromT buySellSwap hintSwap keyFromJst weekendStamp keepEdge; do
            d=research/out/trend/plant-$p
            s=0
            MODE=syn SEED=1 PLANT=$p OUT=$d deno run --v8-flags=--max-old-space-size=8192 \
              --allow-read=. --allow-write=research/out --allow-env research/trend.ts > $d.log 2>&1 || s=$?
            if [ "$s" != "0" ]; then tail -n 40 $d.log; echo "::error::PLANT $p: exit $s"; exit 1; fi
            f=$(python3 -c "import json; print(','.join(json.load(open('$d/checks.json'))['failed']))")
            if [ -z "$f" ]; then echo "::error::PLANT $p: no check of the TS failed"; exit 1; fi
            py=OK
            python3 -I research/trend-check.py --gmo $d/gmo --labels $d/trend-labels.csv --counts $d/counts.json --mode syn > $d.py.log 2>&1 || py=FAILED
            echo "PLANT $p: caught by $f; the Python $py"
          done

  stage0:
    if: ${{ inputs.stage0 == 'yes' }}
    needs: [syn]
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      # GMO's past day files never change once their day has ended: the files §8.102's (a) run kept (1min,
      # 15min, and tf-winrate's 5min, 1hour, 4hour), then §8.90's (dow-hit); only the rest is fetched
      - uses: actions/cache/restore@v4
        with:
          path: research/.cache
          key: gmo-1min-none
          restore-keys: gmo-1min-
      - uses: actions/cache/restore@v4
        with:
          path: research/.cache
          key: gmo-tf-none
          restore-keys: gmo-tf-
      - name: Stage 0 on GMO's bars (only the checks are printed here)
        env:
          MODE: stage0
          OUT: research/out/trend/real
          LABEL_END: ${{ inputs.label_end }}
        run: |
          mkdir -p research/out/trend
          s=0
          deno run --v8-flags=--max-old-space-size=12288 \
            --allow-net=forex-api.coin.z.com --allow-read=. --allow-write=research/.cache,research/out --allow-env \
            research/trend.ts > research/out/trend/real.log 2>&1 || s=$?
          grep -E "^(MODE|read |signals |ok  |FAIL|       |trend-labels|checks failed)" research/out/trend/real.log
          if [ "$s" != "0" ]; then echo "::error::stage 0: exit $s"; exit 1; fi
      - name: The Python on the same files (every label, half and count the same)
        run: |
          python3 -I research/trend-check.py --gmo research/.cache --labels research/out/trend/real/trend-labels.csv \
            --counts research/out/trend/real/counts.json --mode stage0 --label-end "${{ inputs.label_end }}"
      - name: The counts and the examples (every check and the Python passed)
        run: cat research/out/trend/real/print.txt
      # kept even when the run fails, so the files fetched are not fetched again
      - if: always()
        uses: actions/cache/save@v4
        with:
          path: research/.cache
          key: gmo-trend-${{ github.run_id }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trend-stage0
          path: |
            research/out/trend/real/trend-labels.csv
            research/out/trend/real/checks.json
            research/out/trend/real/counts.json
            research/out/trend/real/print.txt
          retention-days: 30

  # trend-labels.csv in parts of 4,500 lines, each in its own job (a job's log is read from its end: the
  # file is written out from the parts and checked against the sha256 the run printed)
  labels:
    needs: [stage0]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        part: [1, 2, 3]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: trend-stage0
          path: out
      - name: trend-labels.csv, part ${{ matrix.part }}
        run: |
          sha256sum out/trend-labels.csv
          wc -l out/trend-labels.csv
          from=$(( (${{ matrix.part }} - 1) * 4500 + 1 ))
          to=$(( ${{ matrix.part }} * 4500 ))
          echo "== part ${{ matrix.part }}: lines $from..$to"
          sed -n "${from},${to}p" out/trend-labels.csv
          echo "== end of part ${{ matrix.part }}"
