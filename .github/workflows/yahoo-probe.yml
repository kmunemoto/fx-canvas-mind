# #391 follow-up (docs §8.140, §8.141): read only. How Yahoo's hourly answer for a share looks around a bar's close
# while New York trades: wait for the next :30 UTC, then read Apple, Tesla and Nvidia 2 s, 30 s, 60 s, 120 s and
# 300 s after it, and print the bar that has just closed, the row after it and the meta. The stock MACD email judges
# a bar a second or two after its end; this shows whether that bar's row has settled by then. Runs once per push of
# this file.
name: yahoo-probe
on:
  push:
    branches:
      - claude/app-confirmation-jvmk03
    paths:
      - .github/workflows/yahoo-probe.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Wait for the next :30 UTC and read around it
        run: |
          python3 - <<'PY'
          import json, time, datetime, urllib.request
          now = time.time()
          t = datetime.datetime.fromtimestamp(now, datetime.timezone.utc).replace(second=0, microsecond=0)
          t = t.replace(minute=30) if t.minute < 30 else (t + datetime.timedelta(hours=1)).replace(minute=30)
          close = t.timestamp()
          print("bar close", t.strftime("%Y-%m-%d %H:%M:%S"), "UTC; waiting", round(close - now), "s", flush=True)
          f = lambda s: datetime.datetime.fromtimestamp(s, datetime.timezone.utc).strftime("%H:%M:%S") if s else None
          for off in (2, 30, 60, 120, 300):
              time.sleep(max(0, close + off - time.time()))
              for sym in ("AAPL", "TSLA", "NVDA"):
                  url = f"https://query1.finance.yahoo.com/v8/finance/chart/{sym}?interval=60m&range=5d&includePrePost=false"
                  try:
                      d = json.load(urllib.request.urlopen(urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"}), timeout=20))
                      r = d["chart"]["result"][0]
                  except Exception as e:
                      print(f"+{off}s {sym} unreadable {e}", flush=True); continue
                  m = r["meta"]; ts = r.get("timestamp", []); q = r["indicators"]["quote"][0]
                  rows = [k for k in range(len(ts)) if ts[k] >= close - 3600]
                  shown = "; ".join(f"{f(ts[k])} o {q['open'][k]} h {q['high'][k]} l {q['low'][k]} c {q['close'][k]} v {q['volume'][k]}" for k in rows)
                  print(f"+{off}s {sym} read {f(time.time())} market {f(m.get('regularMarketTime'))} price {m.get('regularMarketPrice')} | {shown}", flush=True)
          PY
