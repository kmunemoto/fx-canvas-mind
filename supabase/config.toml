[functions.analyze]
verify_jwt = false

[functions.create-checkout]
verify_jwt = false

# Stripe calls this with its own signature, not a Supabase JWT
[functions.stripe-webhook]
verify_jwt = false

[functions.cancel-subscription]
verify_jwt = false

# Authenticates in the function body: a user JWT from the app, or the sweep
# token from the pg_cron job (see migrations/20260903090000_*.sql).
[functions.track-outcomes]
verify_jwt = false

# Authenticates in the function body: the sweep token from pg_cron, or an
# admin's JWT for a manual run.
[functions.postmortem]
verify_jwt = false

# Authenticates in the function body: the sweep token from pg_cron, or an
# admin's JWT for a manual refresh.
[functions.econ-calendar]
verify_jwt = false

# Authenticates in the function body: the sweep token only. No admin-JWT
# branch, because this one spends money on every call it makes — see the
# comment on the gate in its index.ts. It is never scheduled: an operator
# fires it by hand from SQL (docs/OPERATIONS.md §5.2), and that caller sends
# no JWT, so the gateway must not demand one.
[functions.noise-floor]
verify_jwt = false
